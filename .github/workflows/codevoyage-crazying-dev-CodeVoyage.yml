name: CodeVoyage Issue Report
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  issues: read

jobs:
  forward_event:
    runs-on: ubuntu-latest
    steps:
      - name: set key list
        id: trigger_words
        run: |
          TRIGGER_WORDS='["@AI"]'
          echo "trigger_list=$TRIGGER_WORDS" >> $GITHUB_OUTPUT

      - name: collect issue info
        id: extract
        run: |
          REPO_OWNER=${{ github.repository_owner }}
          REPO_NAME=$(echo ${{ github.repository }} | cut -d '/' -f2)
          ISSUE_NUMBER=${{ github.event.issue.number }}
          ISSUE_TITLE=${{ github.event.issue.title }}
          ISSUE_BODY=${{ github.event.issue.body }}
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            TRIGGER_CONTENT="${{ github.event.comment.body }}"
            TRIGGER_SOURCE="comment"
          else
            TRIGGER_CONTENT="${{ github.event.issue.title }} ${{ github.event.issue.body }}"
            TRIGGER_SOURCE="issue"
          fi
          echo "repo_owner=$REPO_OWNER" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
          echo "issue_body<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "trigger_content<<EOF" >> $GITHUB_OUTPUT
          echo "$TRIGGER_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "trigger_source=$TRIGGER_SOURCE" >> $GITHUB_OUTPUT

      - name: find keyword
        id: match_keyword
        uses: actions/github-script@v7
        with:
          script: |
            const triggerList = ${{ steps.trigger_words.outputs.trigger_list }};
            const content = `${{ steps.extract.outputs.trigger_content }}`;
            let hitWord = null;
            for (const w of triggerList) {
              if (content.includes(w)) { hitWord = w; break; }
            }
            if (hitWord) {
              core.setOutput("hit", "true");
              core.setOutput("hit_word", hitWord);
            } else {
              core.setOutput("hit", "false");
            }

      - name: collect comments
        id: fetch_all_comments
        if: steps.match_keyword.outputs.hit == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: '${{ steps.extract.outputs.repo_owner }}',
              repo: '${{ steps.extract.outputs.repo_name }}',
              issue_number: ${{ steps.extract.outputs.issue_number }}
            });
            const simplified = comments.map(c => ({
              user: c.user?.login,
              body: c.body,
              html_url: c.html_url,
              created_at: c.created_at
            }));
            core.setOutput("comments_json", JSON.stringify(simplified));

      - name: push info with POST
        if: steps.match_keyword.outputs.hit == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.BACKEND_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.BACKEND_WEBHOOK_SECRET }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repo_owner "${{ steps.extract.outputs.repo_owner }}" \
            --arg repo_name "${{ steps.extract.outputs.repo_name }}" \
            --arg issue_number "${{ steps.extract.outputs.issue_number }}" \
            --arg issue_title "${{ steps.extract.outputs.issue_title }}" \
            --arg issue_body "${{ steps.extract.outputs.issue_body }}" \
            --arg trigger_source "${{ steps.extract.outputs.trigger_source }}" \
            --arg hit_word "${{ steps.match_keyword.outputs.hit_word }}" \
            --argjson all_comments '${{ steps.fetch_all_comments.outputs.comments_json }}' \
            '{repo_owner: $repo_owner, repo_name: $repo_name, issue_number: ($issue_number|tonumber), issue_title: $issue_title, issue_body: $issue_body, trigger_source: $trigger_source, hit_trigger_word: $hit_word, all_comments: $all_comments}')

          curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            -d "$PAYLOAD"
