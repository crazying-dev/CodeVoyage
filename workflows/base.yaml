name: CodeVoyage Issue Report
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  # 通知工作流（Issue #20）：PR 提交 / 更新 / 关闭同样上报，
  # 这样 PR 提交后也能收到 CodeVoyage 的自动回帖（通知），而不是只有 Issue 有反馈。
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  issues: read
  pull-requests: read

jobs:
  trigger_report:
    runs-on: ubuntu-latest
    steps:
      - name: set key list
        id: trigger_words
        env:
          KEYWORDS_JSON: "[\"Key_List\"]"
        run: |
          echo "trigger_list=$KEYWORDS_JSON" >> $GITHUB_OUTPUT

      - name: get info
        id: extract
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          FULL_REPOSITORY: ${{ github.repository }}
          REPO_OWNER_IN: ${{ github.repository_owner }}
          ISSUE_NUMBER_IN: ${{ github.event.issue.number }}
          ISSUE_TITLE_IN: ${{ github.event.issue.title }}
          ISSUE_BODY_IN: ${{ github.event.issue.body }}
          ISSUE_AUTHOR_IN: ${{ github.event.issue.user.login }}
          ISSUE_IS_PR_IN: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY_IN: ${{ github.event.comment.body }}
          COMMENT_AUTHOR_IN: ${{ github.event.comment.user.login }}
          PR_NUMBER_IN: ${{ github.event.pull_request.number }}
          PR_TITLE_IN: ${{ github.event.pull_request.title }}
          PR_BODY_IN: ${{ github.event.pull_request.body }}
          PR_AUTHOR_IN: ${{ github.event.pull_request.user.login }}
          PR_URL_IN: ${{ github.event.pull_request.html_url }}
          PR_HEAD_IN: ${{ github.event.pull_request.head.ref }}
          PR_BASE_IN: ${{ github.event.pull_request.base.ref }}
          PR_DRAFT_IN: ${{ github.event.pull_request.draft }}
          PR_MERGED_IN: ${{ github.event.pull_request.merged }}
        run: |
          # owner
          REPO_OWNER="$REPO_OWNER_IN"
          # name
          REPO_NAME="${FULL_REPOSITORY#*/}"
          IS_PR="${ISSUE_IS_PR_IN:-false}"
          PR_NUMBER=""
          PR_URL="$PR_URL_IN"
          PR_HEAD="$PR_HEAD_IN"
          PR_BASE="$PR_BASE_IN"
          PR_DRAFT="${PR_DRAFT_IN:-false}"
          PR_MERGED="${PR_MERGED_IN:-false}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR 事件：通知对象就是 PR 本身
            TRIGGER_CONTENT="$PR_TITLE_IN $PR_BODY_IN"
            TRIGGER_SOURCE="pull_request"
            COMMENT_AUTHOR=""
            COMMENT_BODY=""
            ISSUE_NUMBER="${PR_NUMBER_IN:-0}"
            ISSUE_TITLE="$PR_TITLE_IN"
            ISSUE_BODY="$PR_BODY_IN"
            ISSUE_AUTHOR="$PR_AUTHOR_IN"
            IS_PR="true"
            PR_NUMBER="$ISSUE_NUMBER"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            # 评论事件：Issue 与 PR 的评论都走这里（PR 评论属于 issue_comment）
            TRIGGER_CONTENT="$COMMENT_BODY_IN"
            TRIGGER_SOURCE="comment"
            COMMENT_AUTHOR="$COMMENT_AUTHOR_IN"
            COMMENT_BODY="$COMMENT_BODY_IN"
            ISSUE_NUMBER="${ISSUE_NUMBER_IN:-0}"
            ISSUE_TITLE="$ISSUE_TITLE_IN"
            ISSUE_BODY="$ISSUE_BODY_IN"
            ISSUE_AUTHOR="$ISSUE_AUTHOR_IN"
            if [ "$IS_PR" = "true" ]; then
              PR_NUMBER="$ISSUE_NUMBER"
              PR_URL="https://github.com/${REPO_OWNER}/${REPO_NAME}/pull/${ISSUE_NUMBER}"
            fi
          else
            TRIGGER_CONTENT="$ISSUE_TITLE_IN $ISSUE_BODY_IN"
            TRIGGER_SOURCE="issue"
            COMMENT_AUTHOR=""
            COMMENT_BODY=""
            ISSUE_NUMBER="${ISSUE_NUMBER_IN:-0}"
            ISSUE_TITLE="$ISSUE_TITLE_IN"
            ISSUE_BODY="$ISSUE_BODY_IN"
            ISSUE_AUTHOR="$ISSUE_AUTHOR_IN"
          fi

          {
            echo "repo_owner=$REPO_OWNER"
            echo "repo_name=$REPO_NAME"
            echo "issue_number=$ISSUE_NUMBER"
            echo "issue_title=$ISSUE_TITLE"
            echo "issue_author=$ISSUE_AUTHOR"
            echo "comment_author=$COMMENT_AUTHOR"
            echo "trigger_source=$TRIGGER_SOURCE"
            echo "event_name=$EVENT_NAME"
            echo "event_action=${EVENT_ACTION:-}"
            echo "is_pull_request=$IS_PR"
            echo "pr_number=$PR_NUMBER"
            echo "pr_url=$PR_URL"
            echo "pr_head_ref=$PR_HEAD"
            echo "pr_base_ref=$PR_BASE"
            echo "pr_draft=$PR_DRAFT"
            echo "pr_merged=$PR_MERGED"
            echo "issue_body<<CV_EOF"
            echo "$ISSUE_BODY"
            echo "CV_EOF"
            echo "trigger_content<<CV_EOF"
            echo "$TRIGGER_CONTENT"
            echo "CV_EOF"
            echo "comment_body<<CV_EOF"
            echo "$COMMENT_BODY"
            echo "CV_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: find keyword
        id: match_keyword
        env:
          TRIGGER_LIST: ${{ steps.trigger_words.outputs.trigger_list }}
          TRIGGER_CONTENT: ${{ steps.extract.outputs.trigger_content }}
        uses: actions/github-script@v7
        with:
          script: |
            const list = JSON.parse(process.env.TRIGGER_LIST || '[]');
            const content = process.env.TRIGGER_CONTENT || '';
            let hit = null;
            for(const w of list){
              if(w && content.includes(w)){ hit = w; break; }
            }
            if(hit){
              console.log(`key：${hit}`);
              core.setOutput("hit", "true");
              core.setOutput("hit_word", hit);
            }else{
              console.log("no key");
              core.setOutput("hit", "false");
              core.setOutput("hit_word", "");
            }

      - name: get issue
        id: fetch_all_comments
        if: steps.match_keyword.outputs.hit == 'true'
        env:
          REPO_OWNER: ${{ steps.extract.outputs.repo_owner }}
          REPO_NAME: ${{ steps.extract.outputs.repo_name }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: process.env.REPO_OWNER,
              repo: process.env.REPO_NAME,
              issue_number: Number(process.env.ISSUE_NUMBER)
            });
            const simplified = comments.map(c => ({
              user: c.user?.login,
              body: c.body,
              html_url: c.html_url,
              created_at: c.created_at
            }));
            core.setOutput("comments_json", JSON.stringify(simplified));

      # 上报目标与签名密钥一律从仓库配置读取（Variables 优先，其次 Secrets），
      # 不再把服务端地址 / 密钥写死在 workflow 里：
      #   Settings → Secrets and variables → Actions
      #     Variables: CODEVOYAGE_WEBHOOK_URL（例：https://your-server.example.com）
      #     Secrets  : CODEVOYAGE_WEBHOOK_SECRET（与服务端 WEBHOOK_SECRET 一致）
      # 未配置时本步骤直接跳过：Issue 数据不会发往任何外部服务。
      - name: push info with POST
        if: steps.match_keyword.outputs.hit == 'true'
        env:
          WEBHOOK_URL: ${{ vars.CODEVOYAGE_WEBHOOK_URL || secrets.CODEVOYAGE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.CODEVOYAGE_WEBHOOK_SECRET }}
          REPO_OWNER: ${{ steps.extract.outputs.repo_owner }}
          REPO_NAME: ${{ steps.extract.outputs.repo_name }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.extract.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.extract.outputs.issue_body }}
          TRIGGER_SOURCE: ${{ steps.extract.outputs.trigger_source }}
          ISSUE_AUTHOR: ${{ steps.extract.outputs.issue_author }}
          COMMENT_AUTHOR: ${{ steps.extract.outputs.comment_author }}
          HIT_WORD: ${{ steps.match_keyword.outputs.hit_word }}
          ALL_COMMENTS: ${{ steps.fetch_all_comments.outputs.comments_json }}
          EVENT_NAME: ${{ steps.extract.outputs.event_name }}
          EVENT_ACTION: ${{ steps.extract.outputs.event_action }}
          IS_PULL_REQUEST: ${{ steps.extract.outputs.is_pull_request }}
          PR_NUMBER: ${{ steps.extract.outputs.pr_number }}
          PR_URL: ${{ steps.extract.outputs.pr_url }}
          PR_HEAD_REF: ${{ steps.extract.outputs.pr_head_ref }}
          PR_BASE_REF: ${{ steps.extract.outputs.pr_base_ref }}
          PR_DRAFT: ${{ steps.extract.outputs.pr_draft }}
          PR_MERGED: ${{ steps.extract.outputs.pr_merged }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::未配置 CODEVOYAGE_WEBHOOK_URL（仓库 Variables 或 Secrets），已跳过上报，Issue 数据不会发送到任何外部服务。"
            echo "::notice::如需启用 CodeVoyage，请在本仓库 Settings → Secrets and variables → Actions 中配置 CODEVOYAGE_WEBHOOK_URL 与 CODEVOYAGE_WEBHOOK_SECRET。"
            exit 0
          fi

          # 只允许 https：避免 Issue 内容以明文方式发往外部
          case "$WEBHOOK_URL" in
            https://*) ;;
            *)
              echo "::error::CODEVOYAGE_WEBHOOK_URL 必须是 https:// 地址（当前：$WEBHOOK_URL）"
              exit 1
              ;;
          esac

          URL="$WEBHOOK_URL"
          case "$URL" in
            */api/Github/Issue) ;;
            *) URL="${URL%/}/api/Github/Issue" ;;
          esac

          AUTH_HEADER=()
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::warning::未配置 CODEVOYAGE_WEBHOOK_SECRET，本次上报不带签名（服务端若开启校验将拒绝）。"
          else
            AUTH_HEADER=(-H "Authorization: Bearer $WEBHOOK_SECRET")
          fi

          # 布尔值归一化（jq 的 argjson 需要严格的 true / false）
          if [ "$IS_PULL_REQUEST" = "true" ]; then IS_PR_JSON=true; else IS_PR_JSON=false; fi
          if [ "$PR_DRAFT" = "true" ]; then DRAFT_JSON=true; else DRAFT_JSON=false; fi
          if [ "$PR_MERGED" = "true" ]; then MERGED_JSON=true; else MERGED_JSON=false; fi

          PAYLOAD=$(jq -n \
            --arg repo_owner "$REPO_OWNER" \
            --arg repo_name "$REPO_NAME" \
            --arg issue_number "${ISSUE_NUMBER:-0}" \
            --arg issue_title "$ISSUE_TITLE" \
            --arg issue_body "$ISSUE_BODY" \
            --arg trigger_source "$TRIGGER_SOURCE" \
            --arg issue_author "$ISSUE_AUTHOR" \
            --arg comment_author "$COMMENT_AUTHOR" \
            --arg hit_word "$HIT_WORD" \
            --arg event_type "${EVENT_NAME:-}" \
            --arg event_action "${EVENT_ACTION:-}" \
            --argjson is_pull_request "$IS_PR_JSON" \
            --argjson pr_number "${PR_NUMBER:-0}" \
            --arg pr_url "$PR_URL" \
            --arg pr_head_ref "$PR_HEAD_REF" \
            --arg pr_base_ref "$PR_BASE_REF" \
            --argjson pr_draft "$DRAFT_JSON" \
            --argjson pr_merged "$MERGED_JSON" \
            --argjson all_comments "${ALL_COMMENTS:-[]}" \
            '{repo_owner: $repo_owner, repo_name: $repo_name, issue_number: ($issue_number|tonumber), issue_title: $issue_title, issue_body: $issue_body, trigger_source: $trigger_source, issue_author: $issue_author, comment_author: $comment_author, hit_trigger_word: $hit_word, all_comments: $all_comments, event_type: $event_type, event_action: $event_action, is_pull_request: $is_pull_request, pr_number: $pr_number, pr_url: $pr_url, pr_head_ref: $pr_head_ref, pr_base_ref: $pr_base_ref, pr_draft: $pr_draft, pr_merged: $pr_merged}')

          echo "POST $URL"
          CODE=$(curl -sS -L --post301 --post302 --post303 -o resp.txt -w "%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            "${AUTH_HEADER[@]}" \
            -d "$PAYLOAD")
          echo "HTTP $CODE"
          cat resp.txt
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error::服务端返回 $CODE（地址 $URL），请检查 CODEVOYAGE_WEBHOOK_URL / CODEVOYAGE_WEBHOOK_SECRET 配置"
            exit 1
          fi
